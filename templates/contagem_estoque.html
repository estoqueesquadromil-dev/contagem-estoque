<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem de Estoque - Nomus</title>
  <link href="https://cdn.jsdelivr.net/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .autocomplete-items {
      position: absolute;
      border: 1px solid #d4d4d4;
      border-bottom: none;
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #fff;
      max-height: 200px;
      overflow-y: auto;
    }
    .autocomplete-items div {
      padding: 10px;
      cursor: pointer;
      background-color: #fff;
      border-bottom: 1px solid #d4d4d4;
    }
    .autocomplete-items div:hover { background-color: #e9ecef; }
  </style>
</head>
<body>

<div class="container">
  <div class="card p-4 mb-4">
    <h2 class="mb-3 text-primary">Sistema de Contagem de Estoque</h2>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="selectMes" class="form-label">Mês da Contagem:</label>
        <select id="selectMes" class="form-select">
          <option value="01">01 - Janeiro</option>
          <option value="02">02 - Fevereiro</option>
          <option value="03">03 - Março</option>
          <option value="04">04 - Abril</option>
          <option value="05">05 - Maio</option>
          <option value="06">06 - Junho</option>
          <option value="07">07 - Julho</option>
          <option value="08">08 - Agosto</option>
          <option value="09">09 - Setembro</option>
          <option value="10" selected>10 - Outubro</option>
          <option value="11">11 - Novembro</option>
          <option value="12">12 - Dezembro</option>
        </select>
      </div>
      
      <div class="col-md-6">
        <label for="selectAno" class="form-label">Ano:</label>
        <select id="selectAno" class="form-select">
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </div>

    <div class="row g-2 mb-3 position-relative">
      <div class="col-md-6">
        <label for="buscaProduto" class="form-label">Buscar Produto (Código ou Descrição):</label>
        <input type="text" id="buscaProduto" class="form-control" placeholder="Digite para pesquisar..." autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-items"></div>
      </div>
      <div class="col-md-3">
        <label for="qtdProduto" class="form-label">Quantidade:</label>
        <input type="number" id="qtdProduto" class="form-control" value="1" min="1">
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-success w-100" onclick="adicionarNaLista()">Adicionar Item</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle" id="tabelaItens">
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Quantidade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button class="btn btn-primary btn-lg" onclick="salvarLote()">Salvar Contagem no Sheets</button>
    </div>
  </div>
</div>

<script>
  let produtoSelecionado = null;
  let listaLote = [];

  const buscaInput = document.getElementById('buscaProduto');
  const listaAuto = document.getElementById('autocomplete-list');

  buscaInput.addEventListener('input', async function() {
    const termo = this.value.trim();
    listaAuto.innerHTML = '';
    if (!termo) return;

    try {
      const res = await fetch(`/buscar_produtos?termo=${encodeURIComponent(termo)}`);
      const produtos = await res.json();

      produtos.forEach(p => {
        const div = document.createElement('div');
        div.innerHTML = `<strong>${p.codigo}</strong> - ${p.descricao}`;
        div.addEventListener('click', function() {
          buscaInput.value = `${p.codigo} - ${p.descricao}`;
          produtoSelecionado = p;
          listaAuto.innerHTML = '';
        });
        listaAuto.appendChild(div);
      });
    } catch (e) {
      console.error('Erro ao buscar produtos:', e);
    }
  });

  document.addEventListener('click', function (e) {
    if (e.target !== buscaInput) {
      listaAuto.innerHTML = '';
    }
  });

  function adicionarNaLista() {
    if (!produtoSelecionado) {
      alert('Selecione um produto válido da lista!');
      return;
    }
    const qtd = parseInt(document.getElementById('qtdProduto').value) || 1;

    listaLote.push({
      CODIGO: produtoSelecionado.codigo,
      DESCRICAO: produtoSelecionado.descricao,
      QUANTIDADE: qtd,
      TIPO: 'Contagem'
    });

    produtoSelecionado = null;
    buscaInput.value = '';
    document.getElementById('qtdProduto').value = 1;
    renderTabela();
  }

  function renderTabela() {
    const corpo = document.getElementById('corpoTabela');
    corpo.innerHTML = '';

    listaLote.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.CODIGO}</td>
        <td>${item.DESCRICAO}</td>
        <td>${item.QUANTIDADE}</td>
        <td><button class="btn btn-danger btn-sm" onclick="removerItem(${index})">Remover</button></td>
      `;
      corpo.appendChild(tr);
    });
  }

  function removerItem(index) {
    listaLote.splice(index, 1);
    renderTabela();
  }

  async function salvarLote() {
    if (listaLote.length === 0) {
      alert('Adicione ao menos um item antes de salvar!');
      return;
    }

    const mes = document.getElementById('selectMes').value;
    const ano = document.getElementById('selectAno').value;
    const dataLote = `${mes}/${ano}`;

    try {
      const response = await fetch('/salvar_lote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: dataLote,
          itens: listaLote
        })
      });

      const res = await response.json();
      if (res.sucesso) {
        alert(res.mensagem);
        listaLote = [];
        renderTabela();
      } else {
        alert('Erro: ' + res.mensagem);
      }
    } catch (e) {
      alert('Erro ao ligar ao servidor: ' + e);
    }
  }
</script>

</body>
</html>
